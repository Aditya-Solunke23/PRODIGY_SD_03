<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Manager | Prodigy InfoTech</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="app-card">

            <header class="header">

                <div class="icon">👥</div>

                <div>
                    <h1>Contact Manager</h1>
                    <p>Store and manage your contacts easily.</p>
                </div>

            </header>


            <section class="form-section">

                <h2 id="formTitle">Add New Contact</h2>

                <form id="contactForm">

                    <div class="input-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address"
                            required
                        >

                    </div>


                    <div class="form-buttons">

                        <button
                            type="submit"
                            id="submitBtn"
                        >
                            Add Contact
                        </button>

                        <button
                            type="button"
                            id="cancelBtn"
                            class="secondary-btn hidden"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

                <div
                    id="message"
                    class="message"
                ></div>

            </section>


            <section class="contacts-section">

                <div class="contacts-header">

                    <div>

                        <h2>My Contacts</h2>

                        <span id="contactCount">
                            0 contacts
                        </span>

                    </div>


                    <div class="search-wrapper">

                        <input
                            type="search"
                            id="searchInput"
                            placeholder="Search contacts..."
                        >

                    </div>

                </div>


                <div
                    id="contactList"
                    class="contact-list"
                ></div>


                <div
                    id="emptyState"
                    class="empty-state"
                >

                    <div class="empty-icon">
                        📭
                    </div>

                    <h3>No contacts found</h3>

                    <p>
                        Add your first contact using the form above.
                    </p>

                </div>

            </section>


            <footer>
                Prodigy InfoTech — Software Development Internship
            </footer>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
